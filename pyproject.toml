[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgit"
version = "0.1.0"
description = "Link AI agent requests to Git commits and inspect them from a TUI."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "agentgit" }]
dependencies = []

[project.scripts]
agentgit = "agentgit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentgit = ["schema.sql"]
